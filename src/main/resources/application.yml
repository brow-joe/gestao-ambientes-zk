server:
  port: 8080

spring:
  application:
    name: gestao-ambientes-zk

  datasource:
    url: jdbc:h2:mem:zkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

zk:
  homepage: zul/index
  zul-view-resolver-prefix: /
  zul-view-resolver-suffix: .zul
